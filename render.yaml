## Render blueprint — Vabatim free-tier MVP.
##
## One web service and one database. No background worker and no Redis: transcription
## happens on the clinician's device and the documentation pipeline runs inside the web
## service, with job state persisted in Postgres so a refresh or a restart does not lose a
## consultation.
##
## A dedicated worker is not free on Render, so requiring one would have made the MVP
## impossible to run at zero cost. The queue interfaces remain in the codebase; setting
## PROCESSING_MODE=queue and adding a worker service is a later, paid decision — nothing
## needs rewriting for it.
##
## Values marked `sync: false` are secrets. Render prompts for them on first deploy and does
## not store them in this file. Do not replace them with literal values.

services:
  - type: web
    name: vabatim-api
    env: node
    region: frankfurt # closest EU region to the UK
    plan: free
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # --- Security -------------------------------------------------------
      # The API refuses to start if this is missing or shorter than 32 characters.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Comma-separated list of browser origins allowed to call this API directly. Requests
      # proxied through the Vercel rewrite are same-origin and do not need it, but setting it
      # makes direct calls work too.
      - key: CORS_ORIGIN
        sync: false

      # --- Data -----------------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: vabatim-db
          property: connectionString

      # --- Processing -----------------------------------------------------
      # inline: the web service runs documentation generation itself. No queue, no worker,
      # no Redis. Job state lives in Postgres so progress survives a refresh.
      - key: PROCESSING_MODE
        value: inline

      # --- Speech ---------------------------------------------------------
      # device: recognition runs in the clinician's browser at no cost. The server receives
      # text only. Paid cloud providers remain available as optional adapters and are not
      # required by anything.
      - key: SPEECH_PROVIDER
        value: device
      - key: SPEECH_LANGUAGE
        value: en-GB
      # Speaker diarisation is off. The system does not guess who spoke, and says so in the
      # note rather than inventing labels.
      - key: DIARIZATION_PROVIDER
        value: none

      # --- Language model -------------------------------------------------
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # GEMINI_MODEL is intentionally unset. The server asks the API which models the key can
      # serve and picks one. Pinning a model is what broke the previous deployment when that
      # model was retired.

      # --- Storage --------------------------------------------------------
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: vabatim-clinical-storage

      # --- Retention ------------------------------------------------------
      # Audio is not stored by default: the transcript is the clinical artefact, and not
      # keeping the recording is the smallest data footprint that still does the job. These
      # are organisational policy decisions, not legal constants.
      - key: STORE_AUDIO
        value: 'false'
      - key: AUDIO_RETENTION_HOURS
        value: '24'
      - key: TRANSCRIPT_RETENTION_DAYS
        value: '30'

      # --- App ------------------------------------------------------------
      - key: APP_BASE_URL
        sync: false # your Vercel URL, e.g. https://comfeeassistant.vercel.app
      - key: EMAIL_PROVIDER
        value: mock

databases:
  - name: vabatim-db
    databaseName: vabatim
    user: vabatim
    region: frankfurt
    plan: free
