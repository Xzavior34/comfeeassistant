services:
  # 1. Express API Backend Web Service (Render Free/Starter Tier)
  - type: web
    name: vabatim-api
    env: node
    region: frankfurt # EU Region closest to UK
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SPEECH_PROVIDER
        value: device
      - key: SPEECH_LANGUAGE
        value: en-GB
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_BUCKET_NAME
        value: vabatim-clinical-storage

  # 2. BullMQ Background Processing Worker Service
  - type: worker
    name: vabatim-worker
    env: node
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node dist/queues/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPEECH_PROVIDER
        value: device
      - key: SPEECH_LANGUAGE
        value: en-GB
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_BUCKET_NAME
        value: vabatim-clinical-storage
